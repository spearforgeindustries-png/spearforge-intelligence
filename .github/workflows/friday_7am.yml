name: Spearforge Weekly Intelligence Suite

on:
  schedule:
    # ── TEST RUN: Friday 15 May 2026, 3:00 PM IST (09:30 UTC) ──
    - cron: '30 9 15 5 *'

    # ── PRODUCTION: Every Friday 7:00 AM IST (01:30 UTC) ──
    - cron: '30 1 * * 5'

  workflow_dispatch:  # Keep manual trigger for emergencies

jobs:
  intel-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Intel Report
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          GOOGLE_SHEET_ID:     ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main.py
